name: CI Tests For DJ Mix Of The Week
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        run: yarn install
      - name: Run Biome lint
        run: yarn lint
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        run: yarn install
      - name: Run knip
        run: yarn knip
  typecheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        run: yarn install
      - name: Run Astro Type Check
        run: yarn ts-check
  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        run: yarn install
      - name: Run unit tests
        run: yarn test:unit
  e2e:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_API_BASE_URL: https://blog.djmixoftheweek.com
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Install dependencies
        run: yarn install
      - name: Install Playwright system deps
        run: npx playwright install-deps chrome
      - name: Run e2e tests
        run: yarn test:e2e --project=chromium
  axe:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    env:
      GITHUB_API_SECRET: ${{ secrets.PIPELINE_GITHUB_API_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 18.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: yarn install
      - name: Get Chromium version 🌐
        run: |
          CHROMIUM_VERSION=$(wget -qO- https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "Chromium version: $CHROMIUM_VERSION"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> $GITHUB_ENV
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
          install-chromedriver: true
          install-dependencies: true
      - name: Check chromedriver 🚗
        run: |
          echo "Chrome version: ${{ steps.setup-chrome.outputs.chrome-version }}"
          echo "chromedriver version: ${{ steps.setup-chrome.outputs.chromedriver-version }}"
      - run: yarn run build
      - run: yarn dev & npx wait-on http://localhost:4321
      - name: Run axe
        run: |
          yarn add @axe-core/cli
          npx axe --chrome-options="no-sandbox,disable-dev-shm-usage" --chrome-path "${{ steps.setup-chrome.outputs.chrome-path }}" --chromedriver-path "${{ steps.setup-chrome.outputs.chromedriver-path }}" http://localhost:4321/ --load-delay=1500 --exit
